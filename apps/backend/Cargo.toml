[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
mongodb = "3.9.1"
argon2 = "0.5.0"
rand_core = { version = "0.6", features = ["getrandom"] }
dotenvy = "0.15.7"

