[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
mongodb = "3.9.1"
dotenvy = "0.15.7"
bcrypt = "0.19.3"
jwt = "0.16.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }

